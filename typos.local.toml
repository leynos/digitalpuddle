# Repository-specific identifiers, quotations and deliberate fixtures.

schema = 1

[oxford]
stems = []

[words]
# Official name: "GitHub Flavored Markdown".
accepted = ["Flavored"]

[words.corrections]

[patterns]
# Abbreviated hexadecimal commit IDs may begin with dictionary words.
# Inline code spans may contain literal API names and environment variables.
ignore = [
    "`[^`\\n]+`",
    "\\bba[0-9a-f]{5,39}\\b",
]

[files]
exclude = []
